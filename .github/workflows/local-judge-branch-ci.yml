# TEMPORARY — validates the combined local-judge + evidence-check branch. Drop before opening the PR.
name: local-judge-combined CI
on:
  push:
    branches: [feat/local-judge-combined]
permissions:
  contents: read
concurrency:
  group: ljc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build everything
        run: go build ./...
      - name: Vet the touched packages
        run: go vet ./internal/hunch ./internal/ollamad ./internal/voter ./internal/store ./internal/memory ./internal/mcp ./api/rest ./cmd/sage-gui ./web
      - name: Test (race) — light touched packages in full
        run: go test -race -count=1 ./internal/hunch ./internal/ollamad ./internal/voter ./internal/memory ./internal/mcp ./cmd/sage-gui
      - name: Test (race) — gate/evidence tests in the heavy packages
        run: go test -race -count=1 -run 'MemoryGate|SubmitMemory|UploadEvidence|ReviewQueue|ReviewDecision|WriteGate|Judge|Evidence' ./internal/store ./api/rest ./web
