# TEMPORARY — runs the checks for the local-judge branch push. Drop before opening a pull request.
name: local-judge branch CI

on:
  push:
    branches: [feat/local-ollama-judge]

permissions:
  contents: read

concurrency:
  group: local-judge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./internal/hunch
      - name: Tests (race)
        run: go test -race -count=1 -v ./internal/hunch
